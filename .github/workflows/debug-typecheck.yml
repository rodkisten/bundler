name: 🔎 Debug typecheck

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    outputs:
      status: ${{ steps.typecheck.outputs.status }}
      diagnostics: ${{ steps.typecheck.outputs.diagnostics }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: typecheck
        shell: bash
        run: |
          set +e
          pnpm typecheck > typecheck.log 2>&1
          status=$?
          diagnostics=$(base64 -w0 typecheck.log)
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "diagnostics=$diagnostics" >> "$GITHUB_OUTPUT"
          exit 0

  report:
    needs: typecheck
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Print typecheck diagnostics
        env:
          DIAGNOSTICS: ${{ needs.typecheck.outputs.diagnostics }}
        run: echo "$DIAGNOSTICS" | base64 -d
      - name: Fail on typecheck errors
        if: needs.typecheck.outputs.status != '0'
        run: exit 1
