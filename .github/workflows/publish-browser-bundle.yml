name: Apply verified Fábrica refactor

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: read

jobs:
  apply-refactor:
    name: Apply verified refactor as one clean commit
    if: ${{ github.event.pull_request.head.ref == 'agent/fabrica-compiler-structural-refactor' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Assemble patch
        shell: bash
        run: |
          set -euo pipefail
          cat .fabrica-refactor/plain-*.patch > /tmp/fabrica-refactor.patch
          wc -c /tmp/fabrica-refactor.patch
          sha256sum /tmp/fabrica-refactor.patch

      - name: Verify patch integrity
        shell: bash
        run: |
          set -euo pipefail
          echo "3687fa19a4a01d57009c5c3cc42029d1aac7b7d04198c6cb001ed494c4f42de1  /tmp/fabrica-refactor.patch" | sha256sum -c -

      - name: Apply patch onto main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git apply --index --whitespace=nowarn /tmp/fabrica-refactor.patch

      - name: Commit and replace PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: rebuild Fábrica runtime and compiler architecture"
          git push --force origin HEAD:refs/heads/${{ github.event.pull_request.head.ref }}
