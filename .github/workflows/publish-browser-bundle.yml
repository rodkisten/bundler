name: 📦 Publish browser bundles

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:
    inputs:
      project:
        type: choice
        description: "Project to build"
        default: all
        options:
          - auto
          - devtools
          - fabrica
          - cipo
          - broto
          - fabrica-elements
          - seiva-state
          - bundle
          - maquina
          - nascente
          - all

      release_channel:
        type: choice
        description: "Publish until"
        default: both
        options:
          - canary
          - production
          - both

      test_mode:
        type: choice
        description: "Tests"
        default: never
        options:
          - auto
          - always
          - never

      should_typecheck:
        type: boolean
        description: "Run typecheck?"
        default: true

      should_benchmark:
        type: boolean
        description: "Run benchmarks?"
        default: false

      should_deploy_pages:
        type: boolean
        description: "Deploy to GitHub Pages?"
        default: true

      force_clean_deploy:
        type: boolean
        description: "Delete the previous published files before deploy?"
        default: false

      debug_tests:
        type: boolean
        description: "Debug tests (verbose)?"
        default: false

  workflow_call:
    inputs:
      project:
        type: string
        required: false
        default: auto

      release_channel:
        type: string
        required: false
        default: canary

      test_mode:
        type: string
        required: false
        default: never

      should_typecheck:
        type: boolean
        required: false
        default: true

      should_benchmark:
        type: boolean
        required: false
        default: false

      should_deploy_pages:
        type: boolean
        required: false
        default: true

      force_clean_deploy:
        type: boolean
        required: false
        default: false

      debug_tests:
        type: boolean
        required: false
        default: false

    secrets:
      GIST_TOKEN:
        required: false

      GIST_ID:
        required: false

concurrency:
  group: publish-browser-bundles-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
  pull-requests: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.7.0"
  FULL_DIST_DIR: dist
  DEVTOOLS_DIST_DIR: dist
  PAGES_STATE_ARTIFACT: browser-pages-state
  MAIN_FULL_INTERVAL_SECONDS: "300"

jobs:
  scope:
    name: 🧭 Resolve affected projects
    runs-on: ubuntu-24.04

    outputs:
      build_scope: ${{ steps.resolve.outputs.build_scope }}
      affected_projects: ${{ steps.resolve.outputs.affected_projects }}
      affected_count: ${{ steps.resolve.outputs.affected_count }}
      changed_files: ${{ steps.resolve.outputs.changed_files }}
      changed_file_count: ${{ steps.resolve.outputs.changed_file_count }}
      tests_changed: ${{ steps.resolve.outputs.tests_changed }}
      should_test: ${{ steps.resolve.outputs.should_test }}
      release_channel: ${{ steps.resolve.outputs.release_channel }}
      should_deploy: ${{ steps.resolve.outputs.should_deploy }}
      full_reason: ${{ steps.resolve.outputs.full_reason }}
      seconds_since_previous_run: ${{ steps.resolve.outputs.seconds_since_previous_run }}

    steps:
      - name: 📥 Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🧭 Resolve files, projects and policy
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUESTED_PROJECT: ${{ inputs.project || 'auto' }}
          REQUESTED_CHANNEL: ${{ inputs.release_channel || 'canary' }}
          TEST_MODE: ${{ inputs.test_mode || 'auto' }}
          REQUESTED_DEPLOY: ${{ inputs.should_deploy_pages != false }}
          WORKFLOW_FILE: publish-browser-bundle.yml
          CURRENT_RUN_ID: ${{ github.run_id }}
          DEFAULT_BRANCH: main
        run: node scripts/workflows/publish-browser-bundle.mjs resolve-scope

      - name: 📝 Write scope summary
        env:
          BUILD_SCOPE: ${{ steps.resolve.outputs.build_scope }}
          AFFECTED_PROJECTS: ${{ steps.resolve.outputs.affected_projects }}
          AFFECTED_COUNT: ${{ steps.resolve.outputs.affected_count }}
          CHANGED_FILE_COUNT: ${{ steps.resolve.outputs.changed_file_count }}
          TESTS_CHANGED: ${{ steps.resolve.outputs.tests_changed }}
          SHOULD_TEST: ${{ steps.resolve.outputs.should_test }}
          RELEASE_CHANNEL: ${{ steps.resolve.outputs.release_channel }}
          SHOULD_DEPLOY: ${{ steps.resolve.outputs.should_deploy }}
          SECONDS_SINCE_PREVIOUS_RUN: ${{ steps.resolve.outputs.seconds_since_previous_run }}
          FULL_REASON: ${{ steps.resolve.outputs.full_reason }}
          CHANGED_FILES: ${{ steps.resolve.outputs.changed_files }}
        run: node scripts/workflows/publish-browser-bundle.mjs write-scope-summary

  build:
    name: 👷 Build ${{ needs.scope.outputs.build_scope }}
    needs: scope
    if: ${{ needs.scope.outputs.build_scope != 'none' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      GIST_ID: ${{ secrets.GIST_ID }}

      RODERUDA_BUILD_SHA: ${{ github.sha }}

      TZ: America/Sao_Paulo

      BUILD_SCOPE: ${{ needs.scope.outputs.build_scope }}
      RELEASE_CHANNEL: ${{ needs.scope.outputs.release_channel }}

      DEBUG_TESTS: ${{ inputs.debug_tests }}

    steps:
      - name: 📥 Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: 🪼 Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: 🧹 Prepare completely isolated dependency environment
        shell: bash
        run: |
          set -euo pipefail

          echo "🧹 Removing every existing node_modules directory..."

          find . \
            -type d \
            -name node_modules \
            -prune \
            -exec rm -rf '{}' +

          rm -rf .pnpm-store

          # Every workflow execution receives a completely isolated pnpm store.
          STORE_DIR="${RUNNER_TEMP}/pnpm-store-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          pnpm config set store-dir "${STORE_DIR}"

          echo "📦 pnpm store:"
          pnpm store path

          echo "🟢 Node:"
          node --version

          echo "📦 pnpm:"
          pnpm --version

          echo "🔒 Lockfile:"
          sha256sum pnpm-lock.yaml

      - name: 📚 Install dependencies from lockfile
        shell: bash
        run: |
          set -euo pipefail

          pnpm install \
            --frozen-lockfile \
            --force

      - name: 🔬 Inspect TypeScript dependency graph
        shell: bash
        run: |
          set -euo pipefail

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔎 All TypeScript versions in pnpm-lock"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          grep -nE 'typescript(@|:)' pnpm-lock.yaml || true

          echo
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔎 pnpm why typescript"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          pnpm why typescript -r || true

          echo
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔎 Physical TypeScript packages"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          find node_modules/.pnpm \
            -maxdepth 1 \
            -type d \
            -name 'typescript@*' \
            -print \
            | sort || true

          echo
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔎 Root TypeScript resolution"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          node <<'NODE'
          const path = require('node:path')

          function inspect(label, base) {
            try {
              const packageJson = require.resolve(
                'typescript/package.json',
                { paths: [base] },
              )

              const pkg = require(packageJson)

              console.log(`${label}:`)
              console.log(`  base: ${base}`)
              console.log(`  version: ${pkg.version}`)
              console.log(`  package: ${packageJson}`)
            } catch (error) {
              console.error(`${label}: unable to resolve TypeScript`)
              console.error(error)
              process.exitCode = 1
            }
          }

          inspect(
            'workspace root',
            process.cwd(),
          )

          inspect(
            'cipo',
            path.resolve(
              process.cwd(),
              'cipo',
            ),
          )
          NODE

      - name: 🛡️ Assert TypeScript 6
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const path = require('node:path')

          const locations = [
            [
              'workspace root',
              process.cwd(),
            ],
            [
              'cipo',
              path.resolve(
                process.cwd(),
                'cipo',
              ),
            ],
          ]

          let failed = false

          for (const [label, base] of locations) {
            const packageJson = require.resolve(
              'typescript/package.json',
              { paths: [base] },
            )

            const {
              version,
            } = require(packageJson)

            console.log(
              `🔎 ${label}: TypeScript ${version}`,
            )

            if (
              !version.startsWith('6.')
            ) {
              console.error(
                `❌ ${label} resolved TypeScript ${version}. Expected TypeScript 6.x.`,
              )

              console.error(
                `   Resolved from: ${packageJson}`,
              )

              failed = true
            }
          }

          if (failed) {
            process.exit(1)
          }

          console.log(
            '✅ Every checked workspace resolves TypeScript 6.x.',
          )
          NODE

      - name: 🔎 Typecheck
        if: ${{ inputs.should_typecheck != false }}
        shell: bash
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: |
          set -o pipefail

          TYPECHECK_LOG="${RUNNER_TEMP}/typecheck-output.log"

          echo "🔎 TypeScript CLI:"
          pnpm exec tsc --version

          echo "🔎 TypeScript CLI path:"
          command -v tsc || true

          # Keep the full typecheck visible in the regular Actions log while
          # capturing it for the job summary when compilation fails.
          set +e

          pnpm typecheck \
            2>&1 \
            | tee "${TYPECHECK_LOG}"

          TYPECHECK_EXIT_CODE=${PIPESTATUS[0]}

          set -e

          if [ "${TYPECHECK_EXIT_CODE}" -ne 0 ]; then
            {
              echo "## ❌ Typecheck failed"
              echo
              echo '```text'
              cat "${TYPECHECK_LOG}"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

          exit "${TYPECHECK_EXIT_CODE}"

      - name: 🧪 Run tests
        if: ${{ needs.scope.outputs.should_test == 'true' }}
        continue-on-error: ${{ github.ref_name != 'main' }}
        timeout-minutes: 5
        env:
          # ANSI sequences make extraction and Markdown summaries harder to read.
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        shell: bash
        run: |
          set -o pipefail

          TEST_LOG="${RUNNER_TEMP}/vitest-output.log"
          FAILED_TEST_LOG="${RUNNER_TEMP}/vitest-failures.log"

          # Keep the complete Vitest output visible in the regular job log.
          set +e

          node scripts/workflows/publish-browser-bundle.mjs run-tests \
            2>&1 \
            | tee "${TEST_LOG}"

          TEST_EXIT_CODE=${PIPESTATUS[0]}

          set -e

          if [ "${TEST_EXIT_CODE}" -ne 0 ]; then
            # Extract only Vitest's useful failure section:
            #
            #   ─────── Failed Suites 12 ───────
            #   ...
            #   FAIL ...
            #   ...
            #
            # and stop before the final aggregate statistics:
            #
            #   Test Files  12 failed ...
            #
            # This also handles runs that contain only "Failed Tests".
            awk '
              /Failed (Suites|Tests)/ {
                capturing = 1
              }

              capturing && /^[[:space:]]*Test Files[[:space:]]/ {
                exit
              }

              capturing {
                print
              }
            ' "${TEST_LOG}" > "${FAILED_TEST_LOG}"

            {
              echo "## ❌ Vitest failed"
              echo

              if [ -s "${FAILED_TEST_LOG}" ]; then
                echo '```text'
                cat "${FAILED_TEST_LOG}"
                echo '```'
              else
                # Collection/runtime failures do not always produce a standard
                # "Failed Suites" or "Failed Tests" section. Never hide the
                # diagnostic completely when Vitest exits unsuccessfully.
                echo "> Vitest failed before producing its standard failure section."
                echo
                echo "<details>"
                echo "<summary>Show captured Vitest output</summary>"
                echo
                echo '```text'
                cat "${TEST_LOG}"
                echo '```'
                echo
                echo "</details>"
              fi
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

          exit "${TEST_EXIT_CODE}"

      - name: ⚡ Run optional benchmarks
        if: ${{ inputs.should_benchmark == true }}
        continue-on-error: true
        run: node scripts/workflows/publish-browser-bundle.mjs run-benchmarks

      # BUILD_INFO is created before the build so build scripts can access it
      # through process.env.BUILD_INFO.
      - name: 🏷️ Prepare build info
        id: build_metadata
        shell: bash
        run: |
          set -euo pipefail

          # Etc/GMT+3 is UTC-3. The sign is intentionally inverted by the
          # IANA Etc/GMT naming convention.
          BUILD_DATE="$(
            TZ=Etc/GMT+3 \
              date '+%d/%m/%Y %H:%M:%S GMT-3'
          )"

          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_INFO="${BUILD_DATE} | commit ${GITHUB_SHA}"

          # Make BUILD_INFO available to every subsequent workflow step.
          echo "BUILD_INFO=${BUILD_INFO}" >> "${GITHUB_ENV}"

          {
            echo "date=${BUILD_DATE}"
            echo "short_sha=${SHORT_SHA}"
          } >> "${GITHUB_OUTPUT}"

          echo "🏷️ BUILD_INFO=${BUILD_INFO}"

      - name: 🏗️ Build selected project
        run: node scripts/workflows/publish-browser-bundle.mjs build

      - name: 🐤 Create canary aliases
        if: ${{ env.RELEASE_CHANNEL == 'canary' || env.RELEASE_CHANNEL == 'both' }}
        run: node scripts/workflows/publish-browser-bundle.mjs create-canary

      # Gist publication is intentionally disabled for pull requests.
      # Builds that do not produce RodEruda bundles simply skip this operation.
      - name: 🔎 Check RodEruda Gist publication
        id: gist
     #   if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GIST_TOKEN:-}" ]]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"

            echo \
              "::notice::Gist publication skipped because GIST_TOKEN is not configured."

            exit 0
          fi

          if [[ -z "${GIST_ID:-}" ]]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"

            echo \
              "::notice::Gist publication skipped because GIST_ID is not configured."

            exit 0
          fi

          required_files=(
            "dist/roderuda.js"
            "dist/roderuda.min.js"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -s "${file}" ]]; then
              echo "enabled=false" >> "${GITHUB_OUTPUT}"

              echo \
                "::notice::Gist publication skipped because ${file} was not produced by this build."

              exit 0
            fi
          done

          # Build metadata is kept outside dist so publication delta detection
          # is not affected by Gist-only metadata.
          cat > "${RUNNER_TEMP}/roderuda-build.json" <<JSON
          {
            "commit": "${GITHUB_SHA}",
            "commitShort": "${GITHUB_SHA::7}",
            "builtAt": "${{ steps.build_metadata.outputs.date }}",
            "timezone": "GMT-3",
            "buildInfo": "${BUILD_INFO}",
            "scope": "${BUILD_SCOPE}",
            "releaseChannel": "${RELEASE_CHANNEL}",
            "repository": "${GITHUB_REPOSITORY}",
            "runId": "${GITHUB_RUN_ID}",
            "runAttempt": "${GITHUB_RUN_ATTEMPT}"
          }
          JSON

          echo "enabled=true" >> "${GITHUB_OUTPUT}"

          echo "📦 RodEruda Gist publication enabled."
          echo "🏷️ ${BUILD_INFO}"
          echo "🧭 Scope: ${BUILD_SCOPE}"
          echo "🚢 Channel: ${RELEASE_CHANNEL}"

      - name: 📤 Upload RodEruda bundles to Gist
        if: ${{ steps.gist.outputs.enabled == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          set -euo pipefail

          # Construct the request body using jq --rawfile so large JavaScript
          # bundles never need to be passed as shell command-line arguments.
          jq \
            --null-input \
            --arg description \
              "RodEruda | ${BUILD_INFO}" \
            --rawfile roderuda \
              dist/roderuda.js \
            --rawfile roderuda_min \
              dist/roderuda.min.js \
            --rawfile build \
              "${RUNNER_TEMP}/roderuda-build.json" \
            '{
              description: $description,
              files: {
                "roderuda.js": {
                  content: $roderuda
                },
                "roderuda.min.js": {
                  content: $roderuda_min
                },
                "build.json": {
                  content: $build
                }
              }
            }' \
          | gh api \
              --method PATCH \
              "gists/${GIST_ID}" \
              --input -

          echo "✅ RodEruda Gist updated."
          echo "🏷️ ${BUILD_INFO}"

      - name: 📁 Collect changed publication files
        id: delta
        run: node scripts/workflows/publish-browser-bundle.mjs collect-publication

      - name: 📤 Upload affected build files
        uses: actions/upload-artifact@v7
        with:
          name: browser-${{ needs.scope.outputs.build_scope }}-${{ needs.scope.outputs.release_channel }}-${{ github.sha }}
          path: ${{ steps.delta.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: ♻️ Restore previous Pages state
        if: ${{ needs.scope.outputs.should_deploy == 'true' && inputs.force_clean_deploy != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/workflows/publish-browser-bundle.mjs restore-pages-state

      - name: 🧬 Merge publication without deleting previous files
        if: ${{ needs.scope.outputs.should_deploy == 'true' }}
        id: publication
        env:
          FORCE_CLEAN_DEPLOY: ${{ inputs.force_clean_deploy }}
          DELTA_PATH: ${{ steps.delta.outputs.path }}
        run: node scripts/workflows/publish-browser-bundle.mjs merge-publication

      - name: 💾 Persist merged Pages state
        if: ${{ needs.scope.outputs.should_deploy == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PAGES_STATE_ARTIFACT }}
          path: ${{ steps.publication.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: 📟 Upload GitHub Pages artifact
        if: ${{ needs.scope.outputs.should_deploy == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.publication.outputs.path }}

  deploy-pages:
    name: 📟 Deploy GitHub Pages
    needs:
      - scope
      - build

    if: >-
      ${{
        needs.build.result == 'success'
        && needs.scope.outputs.should_deploy == 'true'
      }}

    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🚀 Deploy merged publication
        id: deployment
        uses: actions/deploy-pages@v4

      #- name: 🔔 Notify Pushcut
      #  if: ${{ success() }}
      #  env:
      #    WORKFLOW_ID: ${{ github.workflow_ref }}
      #  run: node scripts/workflows/publish-browser-bundle.mjs notify-pushcut
