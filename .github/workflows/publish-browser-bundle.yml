name: 📦 Publish browser bundles

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:
    inputs:
      project:
        type: choice
        description: "Project to build"
        default: auto
        options:
          - auto
          - devtools
          - fabrica
          - cipo
          - broto
          - fabrica-elements
          - seiva-state
          - bundle
          - all
          - maquina
      release_channel:
        type: choice
        description: "Publish until"
        default: canary
        options:
          - canary
          - production
          - both
      test_mode:
        type: choice
        description: "Tests"
        default: auto
        options:
          - auto
          - always
          - never
      should_typecheck:
        type: boolean
        description: "Run typecheck?"
        default: true
      should_benchmark:
        type: boolean
        description: "Run benchmarks?"
        default: false
      should_deploy_pages:
        type: boolean
        description: "Deploy to GitHub Pages?"
        default: true
      force_clean_deploy:
        type: boolean
        description: "Delete the previous published files before deploy?"
        default: false

  workflow_call:
    inputs:
      project:
        type: string
        required: false
        default: auto
      release_channel:
        type: string
        required: false
        default: canary
      test_mode:
        type: string
        required: false
        default: auto
      should_typecheck:
        type: boolean
        required: false
        default: true
      should_benchmark:
        type: boolean
        required: false
        default: false
      should_deploy_pages:
        type: boolean
        required: false
        default: true
      force_clean_deploy:
        type: boolean
        required: false
        default: false
    secrets:
      GIST_TOKEN:
        required: false
      GIST_ID:
        required: false

concurrency:
  group: publish-browser-bundles-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
  pull-requests: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.5.1"
  FULL_DIST_DIR: dist
  DEVTOOLS_DIST_DIR: dist
  PAGES_STATE_ARTIFACT: browser-pages-state
  MAIN_FULL_INTERVAL_SECONDS: "300"

jobs:
  scope:
    name: 🧭 Resolve affected projects
    runs-on: ubuntu-24.04

    outputs:
      build_scope: ${{ steps.resolve.outputs.build_scope }}
      affected_projects: ${{ steps.resolve.outputs.affected_projects }}
      affected_count: ${{ steps.resolve.outputs.affected_count }}
      changed_files: ${{ steps.resolve.outputs.changed_files }}
      changed_file_count: ${{ steps.resolve.outputs.changed_file_count }}
      tests_changed: ${{ steps.resolve.outputs.tests_changed }}
      should_test: ${{ steps.resolve.outputs.should_test }}
      release_channel: ${{ steps.resolve.outputs.release_channel }}
      should_deploy: ${{ steps.resolve.outputs.should_deploy }}
      full_reason: ${{ steps.resolve.outputs.full_reason }}
      seconds_since_previous_run: ${{ steps.resolve.outputs.seconds_since_previous_run }}

    steps:
      - name: 📥 Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🧭 Resolve files, projects and policy
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUESTED_PROJECT: ${{ inputs.project || 'auto' }}
          REQUESTED_CHANNEL: ${{ inputs.release_channel || 'canary' }}
          TEST_MODE: ${{ inputs.test_mode || 'auto' }}
          REQUESTED_DEPLOY: ${{ inputs.should_deploy_pages != false }}
          WORKFLOW_FILE: publish-browser-bundle.yml
          CURRENT_RUN_ID: ${{ github.run_id }}
          DEFAULT_BRANCH: main
        run: node scripts/workflows/publish-browser-bundle.mjs resolve-scope

      - name: 📝 Write scope summary
        env:
          BUILD_SCOPE: ${{ steps.resolve.outputs.build_scope }}
          AFFECTED_PROJECTS: ${{ steps.resolve.outputs.affected_projects }}
          AFFECTED_COUNT: ${{ steps.resolve.outputs.affected_count }}
          CHANGED_FILE_COUNT: ${{ steps.resolve.outputs.changed_file_count }}
          TESTS_CHANGED: ${{ steps.resolve.outputs.tests_changed }}
          SHOULD_TEST: ${{ steps.resolve.outputs.should_test }}
          RELEASE_CHANNEL: ${{ steps.resolve.outputs.release_channel }}
          SHOULD_DEPLOY: ${{ steps.resolve.outputs.should_deploy }}
          SECONDS_SINCE_PREVIOUS_RUN: ${{ steps.resolve.outputs.seconds_since_previous_run }}
          FULL_REASON: ${{ steps.resolve.outputs.full_reason }}
          CHANGED_FILES: ${{ steps.resolve.outputs.changed_files }}
        run: node scripts/workflows/publish-browser-bundle.mjs write-scope-summary

  build:
    name: 👷 Build ${{ needs.scope.outputs.build_scope }}
    needs: scope
    if: ${{ needs.scope.outputs.build_scope != 'none' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    env:
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      GIST_ID: ${{ secrets.GIST_ID }}
      RODERUDA_BUILD_SHA: ${{ github.sha }}
      TZ: America/Sao_Paulo
      BUILD_SCOPE: ${{ needs.scope.outputs.build_scope }}
      RELEASE_CHANNEL: ${{ needs.scope.outputs.release_channel }}

    steps:
      - name: 📥 Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 📚 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔎 Typecheck
        if: ${{ inputs.should_typecheck != 'false' }}
        run: pnpm typecheck

      - name: 🧪 Run tests
        if: ${{ needs.scope.outputs.should_test == 'true' }}
        run: node scripts/workflows/publish-browser-bundle.mjs run-tests

      - name: ⚡ Run optional benchmarks
        if: ${{ inputs.should_benchmark == true }}
        continue-on-error: true
        run: node scripts/workflows/publish-browser-bundle.mjs run-benchmarks

      - name: 🏗️ Build selected project
        run: node scripts/workflows/publish-browser-bundle.mjs build

      - name: 🐤 Create canary aliases
        if: ${{ env.RELEASE_CHANNEL == 'canary' || env.RELEASE_CHANNEL == 'both' }}
        run: node scripts/workflows/publish-browser-bundle.mjs create-canary

      - name: 📁 Collect changed publication files
        id: delta
        run: node scripts/workflows/publish-browser-bundle.mjs collect-publication

      - name: 📤 Upload affected build files
        uses: actions/upload-artifact@v7
        with:
          name: browser-${{ needs.scope.outputs.build_scope }}-${{ needs.scope.outputs.release_channel }}-${{ github.sha }}
          path: ${{ steps.delta.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: ♻️ Restore previous Pages state
        if: ${{ needs.scope.outputs.should_deploy == 'true' && inputs.force_clean_deploy != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/workflows/publish-browser-bundle.mjs restore-pages-state

      - name: 🧬 Merge publication without deleting previous files
        env:
          FORCE_CLEAN_DEPLOY: ${{ inputs.force_clean_deploy }}
          DELTA_PATH: ${{ steps.delta.outputs.path }}
        if: ${{ needs.scope.outputs.should_deploy == 'true' }}
        id: publication
        run: node scripts/workflows/publish-browser-bundle.mjs merge-publication

      - name: 💾 Persist merged Pages state
        if: ${{ needs.scope.outputs.should_deploy == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PAGES_STATE_ARTIFACT }}
          path: ${{ steps.publication.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: 📟 Upload GitHub Pages artifact
        if: ${{ needs.scope.outputs.should_deploy == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.publication.outputs.path }}

  deploy-pages:
    name: 📟 Deploy GitHub Pages
    needs:
      - scope
      - build
    if: >-
      ${{
        needs.build.result == 'success'
        && needs.scope.outputs.should_deploy == 'true'
      }}
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🚀 Deploy merged publication
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 🔔 Notify Pushcut
        if: ${{ success() }}
        env:
          WORKFLOW_ID: ${{ github.workflow_ref }}
        run: node scripts/workflows/publish-browser-bundle.mjs notify-pushcut
