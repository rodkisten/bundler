name: Diagnose Fábrica refactor patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  diagnose-refactor:
    name: Reconstruct refactor patch
    if: ${{ github.event.pull_request.head.ref == 'agent/fabrica-compiler-structural-refactor' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Assemble patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/refactor-diagnostic
          cat .fabrica-refactor/plain-*.patch > /tmp/refactor-diagnostic/fabrica-refactor.patch
          sha256sum /tmp/refactor-diagnostic/fabrica-refactor.patch > /tmp/refactor-diagnostic/sha256.txt
          wc -c /tmp/refactor-diagnostic/fabrica-refactor.patch > /tmp/refactor-diagnostic/size.txt

      - name: Upload reconstructed patch
        uses: actions/upload-artifact@v7
        with:
          name: reconstructed-fabrica-refactor-patch
          path: /tmp/refactor-diagnostic
          if-no-files-found: error
          retention-days: 1
