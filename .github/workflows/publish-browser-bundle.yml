name: 📦 Publish browser bundles

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      build_scope:
        type: choice
        description: "Build scope"
        default: auto
        options:
          - auto
          - devtools
          - all
      should_typecheck:
        type: boolean
        description: "Run typecheck?"
        default: true
      should_test:
        type: boolean
        description: "Run tests?"
        default: true
      should_benchmark:
        type: boolean
        description: "Run benchmarks?"
        default: false
      should_publish_canary:
        type: boolean
        description: "Create canary aliases?"
        default: true
      should_deploy_pages:
        type: boolean
        description: "Deploy to GitHub Pages?"
        default: true

  workflow_call:
    inputs:
      build_scope:
        type: string
        required: false
        default: auto
      should_typecheck:
        type: boolean
        required: false
        default: true
      should_test:
        type: boolean
        required: false
        default: true
      should_benchmark:
        type: boolean
        required: false
        default: false
      should_publish_canary:
        type: boolean
        required: false
        default: true
      should_deploy_pages:
        type: boolean
        required: false
        default: true
    secrets:
      GIST_TOKEN:
        required: false
      GIST_ID:
        required: false

concurrency:
  group: publish-browser-bundles-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.5.1"
  DEVTOOLS_DIST_DIR: src/devtools/dist
  FULL_DIST_DIR: dist
  DEVTOOLS_CANARY_FILE: devtools.canary.iife.min.js

jobs:
  scope:
    name: 🧭 Detect build scope
    runs-on: ubuntu-24.04

    outputs:
      build_scope: ${{ steps.resolve.outputs.build_scope }}
      only_devtools: ${{ steps.resolve.outputs.only_devtools }}
      changed_files: ${{ steps.resolve.outputs.changed_files }}

    steps:
      - name: 📥 Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: 🧭 Resolve affected build
        id: resolve
        shell: bash
        env:
          REQUESTED_SCOPE: ${{ inputs.build_scope || 'auto' }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          requested_scope="${REQUESTED_SCOPE:-auto}"

          if [[ "$requested_scope" == "devtools" || "$requested_scope" == "all" ]]; then
            build_scope="$requested_scope"
            changed_files="manual:${requested_scope}"
          elif [[ "$EVENT_NAME" != "push" ]]; then
            build_scope="all"
            changed_files="manual:auto"
          else
            empty_sha="0000000000000000000000000000000000000000"

            if [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" == "$empty_sha" ]] \
              || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              changed_files="$(git diff-tree --root --no-commit-id --name-only -r "$HEAD_SHA")"
            else
              changed_files="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
            fi

            # Changes are DevTools-only when every changed path belongs to the
            # DevTools package or to this publishing workflow itself.
            non_devtools_files="$(
              printf '%s\n' "$changed_files" \
                | sed '/^$/d' \
                | grep -Ev '^src/devtools/|^src/devtools\.ts$|^\.github/workflows/(publish-browser-bundle|publish-devtools)\.yml$' \
                || true
            )"

            if [[ -n "$changed_files" && -z "$non_devtools_files" ]]; then
              build_scope="devtools"
            else
              build_scope="all"
            fi
          fi

          if [[ "$build_scope" == "devtools" ]]; then
            only_devtools=true
          else
            only_devtools=false
          fi

          {
            echo "build_scope=$build_scope"
            echo "only_devtools=$only_devtools"
            echo "changed_files<<EOF"
            printf '%s\n' "$changed_files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 📝 Write scope summary
        shell: bash
        run: |
          {
            echo "## 🧭 Build scope"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo '| Scope | `${{ steps.resolve.outputs.build_scope }}` |'
            echo '| DevTools only | `${{ steps.resolve.outputs.only_devtools }}` |'
            echo
            echo "### Changed files"
            echo
            echo '```text'
            printf '%s\n' '${{ steps.resolve.outputs.changed_files }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: 👷 Build ${{ needs.scope.outputs.build_scope }}
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      GIST_ID: ${{ secrets.GIST_ID }}
      RODERUDA_BUILD_SHA: ${{ github.sha }}
      TZ: America/Sao_Paulo

    steps:
      - name: 📥 Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 📚 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔎 Typecheck
        if: ${{ inputs.should_typecheck != false }}
        run: pnpm typecheck

      - name: 🧪 Run tests
        if: ${{ inputs.should_test != false }}
        run: pnpm test

      - name: ⚡ Run benchmarks
        if: ${{ inputs.should_benchmark == true }}
        continue-on-error: true
        run: |
          if [[ '${{ needs.scope.outputs.build_scope }}' == 'devtools' ]]; then
            pnpm bench:devtools
          else
            pnpm bench:ci
          fi

      - name: 🏗️ Build DevTools only
        if: ${{ needs.scope.outputs.build_scope == 'devtools' }}
        run: pnpm build:devtools

      - name: 🏗️ Build every browser script
        if: ${{ needs.scope.outputs.build_scope == 'all' }}
        run: pnpm build

      - name: 🐤 Create DevTools canary alias
        if: >-
          ${{
            inputs.should_publish_canary != false
            && needs.scope.outputs.build_scope == 'devtools'
          }}
        shell: bash
        run: |
          set -euo pipefail

          source_file="$(
            find "$DEVTOOLS_DIST_DIR" -type f \
              \( -name 'devtools.iife.min.js' -o -name '*devtools*iife*.min.js' -o -name '*iife*.min.js' \) \
              ! -name "$DEVTOOLS_CANARY_FILE" \
              | sort \
              | head -n 1
          )"

          if [[ -z "$source_file" ]]; then
            echo "::error::No minified DevTools IIFE was found in $DEVTOOLS_DIST_DIR"
            find "$DEVTOOLS_DIST_DIR" -type f | sort || true
            exit 1
          fi

          cp "$source_file" "$DEVTOOLS_DIST_DIR/$DEVTOOLS_CANARY_FILE"

      - name: 🐤 Create canary aliases for complete build
        if: >-
          ${{
            inputs.should_publish_canary != false
            && needs.scope.outputs.build_scope == 'all'
          }}
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r source_file; do
            filename="$(basename "$source_file")"
            canary_name="${filename/.iife.min.js/.canary.iife.min.js}"

            if [[ "$filename" == *'.canary.iife.min.js' ]]; then
              continue
            fi

            cp "$source_file" "$(dirname "$source_file")/$canary_name"
          done < <(find "$FULL_DIST_DIR" -type f -name '*.iife.min.js' | sort)

      - name: 📁 Prepare publication directory
        id: publication
        shell: bash
        run: |
          set -euo pipefail

          publication_dir="$RUNNER_TEMP/pages-publication"
          rm -rf "$publication_dir"
          mkdir -p "$publication_dir"

          if [[ '${{ needs.scope.outputs.build_scope }}' == 'devtools' ]]; then
            cp -R "$DEVTOOLS_DIST_DIR"/. "$publication_dir"/
          else
            cp -R "$FULL_DIST_DIR"/. "$publication_dir"/
          fi

          echo "path=$publication_dir" >> "$GITHUB_OUTPUT"

          {
            echo "## 📦 Published files"
            echo
            echo '```text'
            find "$publication_dir" -type f | sed "s#^$publication_dir/##" | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: browser-bundles-${{ needs.scope.outputs.build_scope }}-${{ github.sha }}
          path: ${{ steps.publication.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: 📟 Upload GitHub Pages artifact
        if: >-
          ${{
            inputs.should_deploy_pages != false
            && github.ref_name == 'main'
          }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.publication.outputs.path }}

  deploy-pages:
    name: 📟 Deploy GitHub Pages
    needs:
      - scope
      - build
    if: >-
      ${{
        needs.build.result == 'success'
        && inputs.should_deploy_pages != false
        && github.ref_name == 'main'
      }}
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🚀 Deploy
        id: deployment
        uses: actions/deploy-pages@v4
