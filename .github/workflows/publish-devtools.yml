name: 📦🐳 Publish DEVTOOLS ONLY

on:
  workflow_dispatch:
    inputs:
      should_typecheck:
        type: boolean
        description: "Run typecheck?"
        default: true
      should_test:
        type: boolean
        description: "Run tests?"
        default: false
      should_benchmark:
        type: boolean
        description: "Run DevTools benchmarks?"
        default: false
      should_publish_canary:
        type: boolean
        description: "Create devtools.canary.iife.min.js?"
        default: true
      should_deploy_pages:
        type: boolean
        description: "Deploy DevTools to GitHub Pages?"
        default: true

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  publish:
    name: 🐳 Reuse browser publisher
    uses: ./.github/workflows/publish-browser-bundle.yml
    with:
      build_scope: devtools
      should_typecheck: ${{ inputs.should_typecheck }}
      should_test: ${{ inputs.should_test }}
      should_benchmark: ${{ inputs.should_benchmark }}
      should_publish_canary: ${{ inputs.should_publish_canary }}
      should_deploy_pages: ${{ inputs.should_deploy_pages }}
    secrets: inherit
