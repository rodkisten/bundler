name: ⚡ Reliable Performance Observatory

on:
  push:
    branches-ignore:
      - main
    paths:
      - "broto/**"
      - "cipo/**"
      - "devtools/**"
      - "fabrica/**"
      - "fabrica-elements/**"
      - "maquina/**"
      - "seiva-state/**"
      - "rod/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - ".github/workflows/benchmark-regression.yml"

  workflow_dispatch:
    inputs:
      rounds:
        description: "Alternating baseline/current rounds"
        required: false
        default: "3"
      baseline_sha:
        description: "Optional baseline commit; defaults to the previous benchmark-relevant commit"
        required: false
        default: ""

concurrency:
  group: reliable-benchmarks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  benchmark:
    name: 🧪 Same-runner A/B benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: 📥 Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 🧭 Resolve source revisions
        id: revisions
        env:
          INPUT_BASELINE_SHA: ${{ github.event.inputs.baseline_sha }}
          INPUT_ROUNDS: ${{ github.event.inputs.rounds }}
        run: node scripts/workflows/benchmark-regression.mjs resolve-revisions

      - name: 📝 Write revision summary
        env:
          SHOULD_RUN: ${{ steps.revisions.outputs.should_run }}
          REASON: ${{ steps.revisions.outputs.reason }}
          BASE_SHA: ${{ steps.revisions.outputs.base_sha }}
          HEAD_SHA: ${{ steps.revisions.outputs.head_sha }}
          ROUNDS: ${{ steps.revisions.outputs.rounds }}
        if: always()
        run: node scripts/workflows/benchmark-regression.mjs write-revision-summary

      - name: 📦 Setup pnpm
        if: steps.revisions.outputs.should_run == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - name: 🟢 Enable Node.js dependency cache
        if: steps.revisions.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 🌿 Create baseline worktree
        env:
          BASE_SHA: ${{ steps.revisions.outputs.base_sha }}
        if: steps.revisions.outputs.should_run == 'true'
        id: worktree
        run: node scripts/workflows/benchmark-regression.mjs create-worktree

      - name: 📚 Install current dependencies
        if: steps.revisions.outputs.should_run == 'true'
        run: pnpm install --frozen-lockfile=false --prefer-offline

      - name: 📚 Install baseline dependencies
        if: steps.revisions.outputs.should_run == 'true'
        working-directory: ${{ steps.worktree.outputs.base_root }}
        run: pnpm install --frozen-lockfile=false --prefer-offline

      - name: 🧭 Validate current source
        if: steps.revisions.outputs.should_run == 'true'
        run: node scripts/workflows/benchmark-regression.mjs validate-current

      - name: ⚡ Run alternating same-runner comparison
        if: steps.revisions.outputs.should_run == 'true'
        env:
          FORCE_COLOR: "1"
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          BASE_ROOT: ${{ steps.worktree.outputs.base_root }}
          BASE_SHA: ${{ steps.revisions.outputs.base_sha }}
          HEAD_SHA: ${{ steps.revisions.outputs.head_sha }}
          ROUNDS: ${{ steps.revisions.outputs.rounds }}
        run: node scripts/workflows/benchmark-regression.mjs run-comparison

      - name: 📊 Publish job summary
        if: steps.revisions.outputs.should_run == 'true' && always()
        run: node scripts/workflows/benchmark-regression.mjs publish-summary

      - name: 📎 Upload benchmark evidence
        if: steps.revisions.outputs.should_run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: reliable-benchmarks-${{ steps.revisions.outputs.head_sha }}
          path: |
            bench/*.json
            bench/*.md
          retention-days: 30

      - name: 🔒 Verify branch did not advance
        env:
          HEAD_SHA: ${{ steps.revisions.outputs.head_sha }}
        if: steps.revisions.outputs.should_run == 'true'
        id: freshness
        run: node scripts/workflows/benchmark-regression.mjs verify-freshness

      - name: 💾 Commit benchmark files to the PR branch
        if: steps.revisions.outputs.should_run == 'true' && steps.freshness.outputs.fresh == 'true'
        id: commit
        run: node scripts/workflows/benchmark-regression.mjs commit-results

      - name: 💬 Create or update PR benchmark comment
        if: steps.revisions.outputs.should_run == 'true' && always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_PATH: bench/COMPARISON.md
        run: node scripts/workflows/benchmark-regression.mjs update-pr-comment

      - name: 🧹 Remove baseline worktree
        env:
          BASE_ROOT: ${{ steps.worktree.outputs.base_root }}
        if: always() && steps.worktree.outputs.base_root != ''
        run: node scripts/workflows/benchmark-regression.mjs remove-worktree
