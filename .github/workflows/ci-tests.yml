name: 🐛 CI Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      run_benchmarks:
        type: boolean
        description: "Run benchmarks?"
        default: false
      should_run_tests:
        type: boolean
        description: "Run tests?"
        default: true
      test_mode:
        type: choice
        description: "Test mode"
        default: smart
        options:
          - smart
          - all
          - none

concurrency:
  group: publish-browser-bundle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  changes:
    name: "🧭 Detect affected folders"
    runs-on: ubuntu-24.04

    outputs:
      should_test: ${{ steps.detect.outputs.should_test }}
      should_benchmark: ${{ steps.detect.outputs.should_benchmark }}
      test_scope: ${{ steps.detect.outputs.test_scope }}
      reason: ${{ steps.detect.outputs.reason }}
      benchmark_reason: ${{ steps.detect.outputs.benchmark_reason }}
      affected_dirs_json: ${{ steps.detect.outputs.affected_dirs_json }}
      affected_dirs_text: ${{ steps.detect.outputs.affected_dirs_text }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Detect interesting changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INPUT_TEST_MODE: ${{ github.event.inputs.test_mode }}
          INPUT_SHOULD_RUN_TESTS: ${{ github.event.inputs.should_run_tests }}
        run: node scripts/workflows/ci-tests.mjs detect-changes

      - name: Write changes summary
        env:
          SHOULD_TEST: ${{ steps.detect.outputs.should_test }}
          TEST_SCOPE: ${{ steps.detect.outputs.test_scope }}
          REASON: ${{ steps.detect.outputs.reason }}
          SHOULD_BENCHMARK: ${{ steps.detect.outputs.should_benchmark }}
          BENCHMARK_REASON: ${{ steps.detect.outputs.benchmark_reason }}
          AFFECTED_DIRS_TEXT: ${{ steps.detect.outputs.affected_dirs_text }}
        if: always()
        run: node scripts/workflows/ci-tests.mjs write-changes-summary

      - name: Upload changes artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: change-detector-report
          path: artifacts/changes
          retention-days: 14

  test:
    name: "🧪 Run smart tests"
    needs:
      - changes
    if: ${{ needs.changes.outputs.should_test == 'true' }}
    runs-on: ubuntu-24.04
    continue-on-error: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run tests
        id: tests
        continue-on-error: false
        env:
          TEST_SCOPE: ${{ needs.changes.outputs.test_scope }}
          AFFECTED_DIRS_JSON: ${{ needs.changes.outputs.affected_dirs_json }}
        run: node scripts/workflows/ci-tests.mjs run-tests

      - name: Write test summary
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          TEST_SCOPE: ${{ needs.changes.outputs.test_scope }}
          AFFECTED_DIRS_TEXT: ${{ needs.changes.outputs.affected_dirs_text }}
        if: ${{ inputs.run_benchmarks == 'true' }}
        run: node scripts/workflows/ci-tests.mjs write-test-summary

      - name: Run benchmarks
        id: benchmarks
        if: ${{ inputs.run_benchmarks == 'true' && needs.changes.outputs.should_benchmark == 'true' }}
        continue-on-error: true
        run: node scripts/workflows/ci-tests.mjs run-benchmarks

      - name: 🌿 Run Cipo benchmarks
        if: ${{ inputs.run_benchmarks == 'true' && needs.changes.outputs.should_benchmark == 'true' }}
        continue-on-error: true
        run: node scripts/workflows/ci-tests.mjs run-cipo-benchmarks

      - name: Write benchmark summary
        env:
          SHOULD_BENCHMARK: ${{ needs.changes.outputs.should_benchmark }}
          BENCHMARK_REASON: ${{ needs.changes.outputs.benchmark_reason }}
          BENCHMARK_OUTCOME: ${{ steps.benchmarks.outcome || 'skipped' }}
        if: ${{ inputs.run_benchmarks == 'true' }}
        run: node scripts/workflows/ci-tests.mjs write-benchmark-summary

      - name: Upload test artifacts
        if: ${{ inputs.run_benchmarks == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: artifacts/test
          retention-days: 14

