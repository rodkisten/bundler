name: 🧰 Repair context v2 branch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.head_ref == 'refactor/broto-fabrica-context-v2'
      && !contains(github.event.pull_request.head.sha, 'context-v2-tests')
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/broto-fabrica-context-v2
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply repairs
        run: python scripts/fix-context-v2-tests.py

      - name: Commit repaired implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve fragment children and owner context [context-v2-tests]"
          git push origin HEAD:refactor/broto-fabrica-context-v2

      - name: Typecheck
        run: pnpm typecheck

      - name: Run focused regressions
        run: >-
          pnpm vitest run
          src/fabrica/tests/fabrica.component-render.test.ts
          src/fabrica/tests/fabrica.context-architecture.test.ts
          src/devtools/core/context.test.ts
          src/devtools/panels/elements.test.ts
          src/devtools/panels/resources.test.ts
          src/devtools/panels/sources.test.ts
          src/devtools/devtools.mount.test.ts
          src/devtools/devtools.test.ts
          src/maquina/maquina.test.ts

      - name: Run complete suite
        run: pnpm test
