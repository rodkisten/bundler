name: Apply Broto and Fabrica context v2 patch

on:
  push:
    branches:
      - refactor/broto-fabrica-context-v2

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[context-v2-applied]') }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: refactor/broto-fabrica-context-v2
          fetch-depth: 0

      - name: Apply renderer patch
        run: python scripts/apply-broto-fabrica-context-v2.py

      - name: Remove one-shot migration files
        run: |
          rm -f scripts/apply-broto-fabrica-context-v2.py
          rm -f .github/workflows/apply-broto-fabrica-context-v2.yml

      - name: Commit applied patch
        run: |
          if git diff --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fabrica/dom.ts scripts/apply-broto-fabrica-context-v2.py .github/workflows/apply-broto-fabrica-context-v2.yml
          git commit -m "refactor(fabrica): defer component children to provider owner [context-v2-applied]"
          git push origin HEAD:refactor/broto-fabrica-context-v2
